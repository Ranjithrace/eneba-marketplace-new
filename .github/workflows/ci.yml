name: Application checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eneba
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: eneba_marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eneba -d eneba_marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27'}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare database
        env: {PGPASSWORD: ci_only}
        run: |
          psql -h localhost -U eneba -d eneba_marketplace -v ON_ERROR_STOP=1 -f database/001_schema.sql
          psql -h localhost -U eneba -d eneba_marketplace -v ON_ERROR_STOP=1 -f database/002_seed.sql
          psql -h localhost -U eneba -d eneba_marketplace -v ON_ERROR_STOP=1 -f database/003_marketplace_migration.sql
          psql -h localhost -U eneba -d eneba_marketplace -v ON_ERROR_STOP=1 -f database/004_artwork_metadata.sql
      - name: Backend tests and build
        working-directory: backend
        env: {TEST_DATABASE_URL: 'postgres://eneba:ci_only@localhost:5432/eneba_marketplace?sslmode=disable'}
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          go build ./cmd/api
      - name: Frontend dependencies, tests and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm test
          npm run build
